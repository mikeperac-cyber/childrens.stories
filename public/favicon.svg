<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22C55E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16A34A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Book shape -->
  <path d="M20 25 L80 25 L85 30 L85 75 Q85 85 75 85 L25 85 Q15 85 15 75 L15 30 Q15 20 20 25 Z" fill="url(#bookGradient)" stroke="#EA580C" stroke-width="2"/>
  <!-- Book spine -->
  <path d="M20 25 L25 30 L25 85 L20 80 Z" fill="#EA580C" opacity="0.8"/>
  <!-- Pages -->
  <path d="M30 35 L70 35 L70 70 L30 70 Z" fill="#FFFDF5" opacity="0.9"/>
  <path d="M32 38 L68 38 L68 68 L32 68 Z" fill="#FEF9E7" opacity="0.7"/>
  <!-- Sprout/Leaf on book -->
  <path d="M50 20 Q45 10 50 5 Q55 10 50 20 Z" fill="url(#leafGradient)"/>
  <path d="M50 15 L50 25" stroke="#16A34A" stroke-width="2" stroke-linecap="round"/>
  <!-- Sparkles -->
  <circle cx="35" cy="20" r="2" fill="#FBBF24" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="30" r="1.5" fill="#FBBF24" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="25" cy="60" r="1.5" fill="#FBBF24" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>